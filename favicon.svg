<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HGS">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdca6"/>
      <stop offset="0.5" stop-color="#ffb45e"/>
      <stop offset="1" stop-color="#ff8f4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9e4d" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#ff9e4d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff9e4d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grundfläche (randlos: iOS legt die runden Ecken selbst an) -->
  <rect width="512" height="512" fill="#0e0c10"/>

  <!-- weicher Schein um die Sonne -->
  <circle cx="256" cy="262" r="248" fill="url(#glow)"/>

  <!-- untergehende Sonne -->
  <circle cx="256" cy="262" r="152" fill="url(#sun)"/>

  <!-- Dach verdeckt die untere Sonnenhälfte -->
  <path d="M0 512 V430 L256 238 L512 430 V512 Z" fill="#0e0c10"/>
  <path d="M26 438 L256 265 L486 438" fill="none" stroke="#f7f4ee" stroke-width="46"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
